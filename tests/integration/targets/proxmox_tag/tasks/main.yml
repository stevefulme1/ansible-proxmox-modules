---
# Integration tests for stevefulme1.proxmox.proxmox_tag
# Requires: PROXMOX_HOST, PROXMOX_USER, PROXMOX_PASSWORD

- name: Create proxmox_tag
  stevefulme1.proxmox.proxmox_tag:
    vmid: 100
    node: "{{ proxmox_node }}"
    tags:
      - ansible-test
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password }}"
    validate_certs: false
  register: create_result

- name: Verify creation
  ansible.builtin.assert:
    that:
      - create_result is changed

- name: Create proxmox_tag again (idempotency)
  stevefulme1.proxmox.proxmox_tag:
    vmid: 100
    node: "{{ proxmox_node }}"
    tags:
      - ansible-test
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password }}"
    validate_certs: false
  register: idem_result

- name: Verify idempotency
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Update proxmox_tag
  stevefulme1.proxmox.proxmox_tag:
    vmid: 100
    node: "{{ proxmox_node }}"
    tags:
      - ansible-test
      - ansible-test-2
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password }}"
    validate_certs: false
  register: update_result

- name: Verify update
  ansible.builtin.assert:
    that:
      - update_result is changed

- name: Delete proxmox_tag
  stevefulme1.proxmox.proxmox_tag:
    vmid: 100
    node: "{{ proxmox_node }}"
    tags: []
    state: absent
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password }}"
    validate_certs: false
  register: delete_result

- name: Verify deletion
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete proxmox_tag again (idempotency)
  stevefulme1.proxmox.proxmox_tag:
    vmid: 100
    node: "{{ proxmox_node }}"
    tags: []
    state: absent
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password }}"
    validate_certs: false
  register: delete_idem

- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
