---
# extensions/audit/event_query.yml
# Indirect Node Counting query for stevefulme1.proxmox
stevefulme1.proxmox.proxmox_vm_create:
  query: >-
    {
      name: .msg,
      canonical_facts: {
        uuid: (.vmid | tostring)
      },
      facts: {
        device_type: "virtual_machine"
      }
    }

stevefulme1.proxmox.proxmox_lxc_create:
  query: >-
    {
      name: .msg,
      canonical_facts: {
        uuid: (.vmid | tostring)
      },
      facts: {
        device_type: "container"
      }
    }

stevefulme1.proxmox.proxmox_vm_config:
  query: >-
    {
      name: (.config.name // ""),
      canonical_facts: {
        uuid: (.vmid | tostring)
      },
      facts: {
        device_type: "virtual_machine"
      }
    }

stevefulme1.proxmox.proxmox_lxc_config:
  query: >-
    {
      name: (.config.hostname // ""),
      canonical_facts: {
        uuid: (.vmid | tostring)
      },
      facts: {
        device_type: "container"
      }
    }

stevefulme1.proxmox.proxmox_storage:
  query: >-
    {
      name: .storage,
      canonical_facts: {
        uuid: .storage
      },
      facts: {
        device_type: "block_storage"
      }
    }
